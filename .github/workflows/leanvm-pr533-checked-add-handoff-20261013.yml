name: leanVM checked Aeneas additions source-pinned handoff
on:
  push:
    branches:
      - research/leanvm-pr533-checked-add-handoff-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct exact upstream source and arithmetic invariants
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cd leanVM
          test "$(git hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 4853d8a398a1ff2762a71473c17c17e175f80b73
          git apply --check ../handoff_leanvm_533/swar42-and-range.patch
          git apply ../handoff_leanvm_533/swar42-and-range.patch
          test "$(git hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 7460dd8c3920c39e2d599ba36d16b77c3d444d1e
          test ! -e verification/leanxmss/GuestAddPrefixes.lean
          cp ../handoff_leanvm_533/GuestAddPrefixes.lean verification/leanxmss/GuestAddPrefixes.lean
          test "$(git hash-object verification/leanxmss/GuestAddPrefixes.lean)" = 68dc7237711152dd54c1257fab33c0e0a361de04
          git diff --check
          git diff --stat
          echo 'Exact guest checked-addition proof sources independently reconstructed.'

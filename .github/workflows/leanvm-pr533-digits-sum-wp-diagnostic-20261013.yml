name: leanVM PR533 exact translated Digits.sum WP diagnostic
on:
  push:
    branches:
      - research/leanvm-pr533-digits-sum-wp-diagnostic-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact translated guest and checked arithmetic
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/Encoding-swar42-all-range-bounds.lean leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean
          cp research/leanvm-pr533/DigitsSumWPDiagnostic.lean leanVM/verification/leanxmss/DigitsSumWPDiagnostic.lean
          git -C leanVM diff --check
      - name: Install pinned Lean
        run: |
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build dependencies and check exact guest WP
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          lake env lean DigitsSumWPDiagnostic.lean
          echo "Source-backed Digits.sum proof compiled; no admitted proof."

name: leanVM combined fold6 fold12 patch reapplication

on:
  push:
    branches:
      - research/leanvm-pr533-both-folds-handoff-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Clone pinned upstream PR #533
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
      - name: Check parent and result Git blobs
        run: |
          cd leanVM
          test "$(git hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 4853d8a398a1ff2762a71473c17c17e175f80b73
          git apply --check ../handoff_leanvm_533/both-folds.patch
          git apply ../handoff_leanvm_533/both-folds.patch
          test "$(git hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 41b62c33554ff74b96c129e21cc7fd11d225179c
          git diff --check
          git diff --stat
          echo 'Source-pinned two-lemma reapplication passed.'

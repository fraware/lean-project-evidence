name: leanVM #533 fold12 patch reapplication

on:
  push:
    branches:
      - research/leanvm-pr533-fold12-handoff-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact upstream PR
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
      - name: Validate source blob, apply patch, and validate result blob
        run: |
          cd leanVM
          test "$(git hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 4853d8a398a1ff2762a71473c17c17e175f80b73
          git apply --check ../handoff_leanvm_533/fold12.patch
          git apply ../handoff_leanvm_533/fold12.patch
          test "$(git hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 3f135ec7d108a821371f3db4b8e63c339665d823
          git diff --check
          git diff --stat
          echo 'Verified original blob, patch applicability, and checked candidate blob.'

name: leanSpec PR1204 actual reservation race reproduction

on:
  push:
    branches:
      - research/ethereum-xmss-reservations-20261012
    paths:
      - 'experiments/ethereum-xmss/pr1204_race.py'
      - '.github/workflows/ethereum-xmss-pr1204-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-pr-race:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research reproducer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python3 -m pip install 'uv>=0.7,<1'
      - name: Fetch exactly pinned actual PR #1204
        run: |
          git clone --filter=blob:none https://github.com/leanEthereum/leanSpec.git leanSpec
          git -C leanSpec fetch origin pull/1204/head
          git -C leanSpec checkout --detach e8f9c29da3c2b725b988ed85dac8dce3d89d0012
          test "$(git -C leanSpec rev-parse HEAD)" = e8f9c29da3c2b725b988ed85dac8dce3d89d0012
      - name: Install pinned PR dependencies
        run: |
          cd leanSpec
          uv sync --frozen --group test
      - name: Run actual SigningProtection.reserve race tests
        run: |
          cd leanSpec
          uv run --no-sync --group test python ../experiments/ethereum-xmss/pr1204_race.py

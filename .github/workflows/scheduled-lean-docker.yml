name: Scheduled Lean Docker Mathlib

# CLOSURE-017 / spec §19.2 — weekly jobs that skip cleanly when tooling is absent.
# Default PR CI (ci.yml) stays Python-only and never requires Lean/Docker/secrets.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate compatibility matrix schema
        run: python scripts/validate_compatibility_matrix.py --json
      - name: Fixture extract unit path (no network)
        run: pytest -q tests/unit/test_generic_extract.py tests/unit/test_compatibility_matrix.py

  lean-fixture-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Toolchain JSON + regex honesty (no Lake required)
        run: |
          pytest -q tests/integration/test_evidence_lean_repo.py \
            tests/unit/test_lean_extractor.py \
            tests/unit/test_section21_golden.py

  ledger-longevity-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: 100k ledger longevity (slow marker)
        run: pytest -q -m slow tests/longevity

  performance-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Soft performance baselines
        run: pytest -q -m "performance and not slow and not lean and not docker"

  sbom-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate Python package SBOM artifacts
        run: |
          python scripts/generate_sbom.py --skip-image --out-dir artifacts/sbom
          test -f artifacts/sbom/lean-project-evidence.cdx.json
          ls -la artifacts/sbom

  docker-image-optional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never builds the image in CI (multi-minute). Skips cleanly when absent.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Docker Lean E2E or skip
        env:
          LPE_DOCKER_IMAGE: lpe-lean:4.14
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "SKIP: docker not available on runner"
            exit 0
          fi
          if ! docker image inspect lpe-lean:4.14 >/dev/null 2>&1; then
            echo "SKIP: lpe-lean:4.14 not present (build via scripts/build_lean_docker_image.sh)"
            echo "SBOM recipe still runs in sbom-recipe job for the Python package."
            exit 0
          fi
          python scripts/generate_sbom.py --out-dir artifacts/sbom --image lpe-lean:4.14
          pytest -q -m "docker and not slow" \
            tests/integration/test_evidence_lean_e2e.py \
            tests/integration/test_evidence_docker_build.py

  github-check-e2e-scheduled:
    name: "CLOSURE-031 GitHub Check E2E (scheduled)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Live Check E2E or skip (needs secrets)
        env:
          LPE_GH_CHECK_E2E: ${{ vars.LPE_GH_CHECK_E2E }}
          LPE_GH_CHECK_REPO: ${{ vars.LPE_GH_CHECK_REPO }}
          LPE_GH_CHECK_SHA: ${{ vars.LPE_GH_CHECK_SHA }}
          GH_TOKEN: ${{ secrets.LPE_GH_CHECK_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          if [ "${LPE_GH_CHECK_E2E}" != "1" ]; then
            echo "SKIP: vars.LPE_GH_CHECK_E2E is not '1' (operator/secrets-gated)."
            exit 0
          fi
          if [ -z "${LPE_GH_CHECK_REPO}" ] || [ -z "${LPE_GH_CHECK_SHA}" ]; then
            echo "SKIP: dedicated-repo vars unset."
            exit 0
          fi
          pytest -q tests/integration/test_github_check_e2e.py

name: leanVM PR533 no-wrap proof for packed12 shift-add stages

on:
  push:
    branches:
      - research/leanvm-pr533-fold-intermediates-u64-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-post-fold-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact upstream PR #533 source and proposed proof
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/Encoding-fold-intermediates-u64.lean leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean
          git -C leanVM diff --check
      - name: Install pinned Lean 4 toolchain
        run: |
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify full project and numeric no-wrap axiom closure
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          printf 'import LeanxmssProofs\n#print axioms leanxmss.Proofs.Encoding.packed12_shift_add_stages_fit_u64\n#print axioms leanxmss.Proofs.Encoding.packed12_six_strong_bound\n#print axioms leanxmss.Proofs.Encoding.swar42_initial_sum_fits_u64\n' > AxiomAudit.lean
          lake env lean AxiomAudit.lean | tee "$RUNNER_TEMP/axioms.txt"
          for name in packed12_shift_add_stages_fit_u64 packed12_six_strong_bound swar42_initial_sum_fits_u64; do
            grep -F "'leanxmss.Proofs.Encoding.$name' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fv sorryAx
          done

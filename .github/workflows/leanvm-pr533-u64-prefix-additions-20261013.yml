name: leanVM three real checked U64 additions and prefixes
on:
  push:
    branches:
      - research/leanvm-pr533-u64-prefix-additions-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exact PR533 parent and unchanged range lemmas
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/Encoding-swar42-all-range-bounds.lean leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean
          cp research/leanvm-pr533/GuestAddPrefixes.lean leanVM/verification/leanxmss/GuestAddPrefixes.lean
          git -C leanVM diff --check
      - name: Pinned Lean compiler
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and verify real checked additions
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          lake env lean -o .lake/build/lib/lean/GuestAddPrefixes.olean GuestAddPrefixes.lean
          printf 'import GuestAddPrefixes\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_first_add_spec\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_initial_prefixes\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_second_add_spec\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_third_add_spec\n' > Axioms.lean
          lake env lean Axioms.lean | tee "$RUNNER_TEMP/axioms.txt"
          for lemma in swar42_guest_first_add_spec swar42_guest_initial_prefixes swar42_guest_second_add_spec swar42_guest_third_add_spec; do
            grep -F "'leanxmss.Proofs.Encoding.$lemma' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fv sorryAx
          done

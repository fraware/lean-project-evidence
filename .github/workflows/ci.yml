name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Pin full commit SHAs (AUDIT-024); version comments aid Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: CODEOWNERS placeholder check
        # Fail-closed: no LPE_CODEOWNERS_PLACEHOLDERS_OK escape in CI (AUDIT-022 closed).
        run: python scripts/check_codeowners_placeholders.py
      - name: Dependency vulnerability audit
        run: python -m pip install pip-audit && pip-audit
      - name: Schema drift check
        run: python scripts/export_schemas.py --check
      - name: Milestone status drift check
        run: python scripts/check_milestone_status.py
      - name: Version/docs sync check
        run: python scripts/check_version_sync.py
      - name: Repository tree + MANIFEST drift check (CLOSURE-032)
        run: python scripts/sync_repository_inventory.py --check
      - name: Compatibility matrix validate
        run: python scripts/validate_compatibility_matrix.py
      - name: Relative doc-link check
        run: python scripts/check_doc_links.py
      - name: Ruff lint (full src/lpe + release scripts)
        run: |
          python -m ruff check \
            scripts/verify_wheel.py \
            scripts/generate_sbom.py \
            scripts/validate_compatibility_matrix.py \
            scripts/check_doc_links.py \
            scripts/check_coverage_gates.py \
            src/lpe
      - run: make check
      - name: Mypy (full src/lpe)
        run: |
          python -m mypy src/lpe
      - name: Coverage gate (§19.3 lines 90% / critical 95% / branch 85% hard)
        run: |
          pytest -q --cov=lpe --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json \
            -m "not slow and not lean and not docker" \
            tests/unit tests/security
          # Line fail-under is enforced here (not via --cov-fail-under) because
          # pytest-cov's fail-under uses combined line+branch percent when
          # --cov-branch is enabled; §19 separates 90% lines from 85% branches.
          python scripts/check_coverage_gates.py coverage.json --fail-under=90 --require-critical --require-branch
          echo "§19.3: overall lines >=90% hard; critical packages >=95% hard; branch >=85% hard."
      - name: Package build + wheel smoke (§19.4)
        run: |
          python -m pip install build
          python -m build
          python scripts/verify_wheel.py dist/*.whl
      - name: SBOM recipe (Python package)
        run: python scripts/generate_sbom.py --skip-image --out-dir artifacts/sbom
      - run: lpe doctor
      - name: Honesty and seal CLI smoke
        run: pytest -q tests/integration/test_honesty_seal_cli_smoke.py

  # Best-effort pure-Python OS matrix (§19.1). Continues on error so macOS/Windows
  # flakes do not block Ubuntu merge; still runs on every PR for visibility.
  python-os-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/export_schemas.py --check
      - run: python scripts/validate_compatibility_matrix.py
      - run: pytest -q -m "not slow and not lean and not docker" tests/unit
        shell: bash

  # CLOSURE-031 / 0.3.0 readiness path: live GitHub Check POST on a dedicated
  # throwaway repo. Always scheduled so the path is visible; skips cleanly when
  # vars/secrets are unset (never fails the default merge gate for missing auth).
  # Token never reaches candidate execution (gh api only).
  github-check-e2e:
    name: "CLOSURE-031 GitHub Check E2E (0.3.0 readiness)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Live GitHub Check E2E or skip (fail-closed ESCALATE when run)
        env:
          LPE_GH_CHECK_E2E: ${{ vars.LPE_GH_CHECK_E2E }}
          LPE_GH_CHECK_REPO: ${{ vars.LPE_GH_CHECK_REPO }}
          LPE_GH_CHECK_SHA: ${{ vars.LPE_GH_CHECK_SHA }}
          GH_TOKEN: ${{ secrets.LPE_GH_CHECK_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          echo "=== CLOSURE-031 / 0.3.0 readiness path (dedicated-repo Check E2E) ==="
          echo "Docs: docs/github_check_e2e.md"
          echo "ESCALATE maps to Check conclusion=failure (fail-closed)."
          if [ "${LPE_GH_CHECK_E2E}" != "1" ]; then
            echo "SKIP: vars.LPE_GH_CHECK_E2E is not '1'."
            echo "Configure repository variables/secrets to enable live E2E for 0.3.0 acceptance."
            echo "Required: LPE_GH_CHECK_E2E=1, LPE_GH_CHECK_REPO, LPE_GH_CHECK_SHA,"
            echo "          secret LPE_GH_CHECK_TOKEN (or GH_TOKEN) with checks:write."
            exit 0
          fi
          if [ -z "${LPE_GH_CHECK_REPO}" ] || [ -z "${LPE_GH_CHECK_SHA}" ]; then
            echo "SKIP: LPE_GH_CHECK_REPO and/or LPE_GH_CHECK_SHA not set."
            echo "CLOSURE-031 incomplete until dedicated throwaway repo vars are configured."
            exit 0
          fi
          export LPE_GH_CHECK_E2E=1
          pytest -q tests/integration/test_github_check_e2e.py

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin full commit SHAs (AUDIT-024); version comments aid Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: CODEOWNERS placeholder check
        # Warning until launch replaces placeholders; remove env to fail-closed (AUDIT-022).
        env:
          LPE_CODEOWNERS_PLACEHOLDERS_OK: "1"
        run: python scripts/check_codeowners_placeholders.py
      - name: Dependency vulnerability audit
        run: python -m pip install pip-audit && pip-audit
      - run: make check
      - run: lpe doctor

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin full commit SHAs (AUDIT-024); version comments aid Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: CODEOWNERS placeholder check
        # Fail-closed: no LPE_CODEOWNERS_PLACEHOLDERS_OK escape in CI (AUDIT-022 closed).
        run: python scripts/check_codeowners_placeholders.py
      - name: Dependency vulnerability audit
        run: python -m pip install pip-audit && pip-audit
      - run: make check
      - run: lpe doctor
      - name: Honesty and seal CLI smoke
        run: pytest -q tests/integration/test_honesty_seal_cli_smoke.py

  # Optional live GitHub Check POST. Never part of the default merge gate.
  # Enable with repository variable LPE_GH_CHECK_E2E=1 plus repo/SHA vars.
  # Missing secrets/vars skip cleanly (exit 0) — see docs/github_check_e2e.md.
  github-check-e2e-optional:
    runs-on: ubuntu-latest
    if: ${{ vars.LPE_GH_CHECK_E2E == '1' }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Live GitHub Check E2E (skip if misconfigured)
        env:
          LPE_GH_CHECK_E2E: "1"
          LPE_GH_CHECK_REPO: ${{ vars.LPE_GH_CHECK_REPO }}
          LPE_GH_CHECK_SHA: ${{ vars.LPE_GH_CHECK_SHA }}
          GH_TOKEN: ${{ secrets.LPE_GH_CHECK_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          if [ -z "${LPE_GH_CHECK_REPO}" ] || [ -z "${LPE_GH_CHECK_SHA}" ]; then
            echo "LPE_GH_CHECK_REPO and/or LPE_GH_CHECK_SHA not set."
            echo "Skipping live Check E2E (not a failure). See docs/github_check_e2e.md."
            exit 0
          fi
          pytest -q tests/integration/test_github_check_e2e.py

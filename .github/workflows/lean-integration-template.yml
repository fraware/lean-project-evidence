name: Lean integration template

# Week 2: optional Lean/Lake path. Default CI does not require Docker or Lean.
# Prefer the deterministic toolchain JSON fixture when Lake is unavailable:
#   tests/fixtures/lean/toolchain_project/.lpe/lean-extraction.json
# Run pytest integration Lean/Docker suites separately:
#   pytest -q tests/integration/test_evidence_lean_repo.py
#   pytest -q -m docker tests/integration/test_evidence_docker_build.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  lean-toolchain-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Toolchain JSON + regex honesty (no Lake required)
        run: pytest -q tests/integration/test_evidence_lean_repo.py tests/unit/test_lean_extractor.py

  lean-lake-optional:
    runs-on: ubuntu-latest
    steps:
      # Pin full commit SHAs (AUDIT-024); version comments aid Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: false
          test: false
          use-mathlib-cache: auto
      - name: Document fixture path
        run: |
          echo "No Mathlib-lite lakefile is committed yet."
          echo "Use tests/fixtures/lean/toolchain_project for compiler toolchain ingest."
          echo "When a pinned Lean fixture lands under tests/fixtures/lean/repos/, wire lpe evidence compile here."

  # Optional: sandboxed Lean via pre-built lpe-lean:4.14.
  # Does NOT build the image in CI (multi-minute). Provide the image via a
  # self-hosted runner cache, a private registry pull, or skip the job.
  # Default CI (ci.yml) never requires this job.
  lpe-lean-docker-optional:
    runs-on: ubuntu-latest
    if: ${{ vars.LPE_LEAN_DOCKER_JOB == '1' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Require cached lpe-lean:4.14 (never build in CI)
        run: |
          if ! docker image inspect lpe-lean:4.14 >/dev/null 2>&1; then
            echo "Image lpe-lean:4.14 not present."
            echo "Build locally with scripts/build_lean_docker_image.sh and load onto the runner,"
            echo "or pull a pinned private mirror. This job must not docker build."
            exit 1
          fi
      - name: Docker Lean E2E (combined build+extract)
        env:
          LPE_DOCKER_IMAGE: lpe-lean:4.14
        run: |
          pytest -q -m "docker and not slow" \
            tests/integration/test_evidence_lean_e2e.py \
            tests/integration/test_evidence_docker_build.py

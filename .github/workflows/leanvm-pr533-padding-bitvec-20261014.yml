name: leanVM XMSS source-accurate high-bit OR encoding condition
on:
  push:
    branches:
      - research/leanvm-pr533-encoding-padding-bitvec-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin upstream and added proof only
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/PaddingBitVec.lean leanVM/verification/leanxmss/PaddingBitVec.lean
          git -C leanVM diff --check
      - name: Install source-pinned Lean
        run: |
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact padding proposition and its axiom closure
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build LeanxmssProofs.Encoding
          lake env lean -o .lake/build/lib/lean/PaddingBitVec.olean PaddingBitVec.lean
          printf 'import PaddingBitVec\n#print axioms leanxmss.Proofs.Encoding.guest_padded_or_iff\n' > PaddingAxioms.lean
          lake env lean PaddingAxioms.lean | tee /tmp/padding-axioms.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          content = Path("PaddingAxioms.lean").read_text()
          assert "#print axioms leanxmss.Proofs.Encoding.guest_padded_or_iff" in content
          output = Path("/tmp/padding-axioms.txt").read_text()
          m = re.search(r"'leanxmss\\.Proofs\\.Encoding\\.guest_padded_or_iff' depends on axioms: \\[(.*?)\\]", output, re.S)
          assert m, "missing complete axiom closure"
          axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          assert axioms <= allowed, f"unexpected axiom(s): {axioms - allowed}"
          print("Kernel-style axiom whitelist satisfied:", sorted(axioms))
          PY

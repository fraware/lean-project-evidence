name: LeanVM PR533 bitvector padding semantics bridge

on:
  push:
    branches:
      - research/leanvm-pr533-padding-bitvector-bridge-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  padding-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact PR head and overlay arithmetic plus padding proof
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/Encoding-padding-bitvector.lean leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean
          git -C leanVM diff --check
      - name: Install Lean pinned compiler
        run: |
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check padding bridge and report assumptions
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          printf 'import LeanxmssProofs\n#print axioms leanxmss.Proofs.Encoding.top_bit_clear_iff_padded\n#print axioms leanxmss.Proofs.Encoding.or_top_bit_clear_iff_both_padded\n#print axioms leanxmss.Proofs.Encoding.swar42_nat_spec\n' > Axioms.lean
          lake env lean Axioms.lean | tee "$RUNNER_TEMP/axioms.txt"
          for name in top_bit_clear_iff_padded or_top_bit_clear_iff_both_padded swar42_nat_spec; do
            grep -F "'leanxmss.Proofs.Encoding.$name' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fv sorryAx
          done

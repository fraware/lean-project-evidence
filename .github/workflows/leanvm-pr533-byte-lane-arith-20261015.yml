name: leanVM XMSS bitvector byte lane arithmetic proof
on:
  push:
    branches:
      - research/leanvm-pr533-byte-lane-arith-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact upstream and proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/leanvm-pr533/DigestBytesBridge.lean)" = e73c1e756b68ce4ae9183850dc452dabab1b532a
          test "$(git hash-object research/leanvm-pr533/BytePackBitVec.lean)" = e7e2cbf43c01a59acbe2fabf564f820487d2f837
          test "$(git hash-object research/leanvm-pr533/ByteLaneArithmetic.lean)" = f26adb073a94296b62671c8807971d9f21b66036
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/DigestBytesBridge.lean leanVM/verification/leanxmss/DigestBytesBridge.lean
          cp research/leanvm-pr533/BytePackBitVec.lean leanVM/verification/leanxmss/BytePackBitVec.lean
          cp research/leanvm-pr533/ByteLaneArithmetic.lean leanVM/verification/leanxmss/ByteLaneArithmetic.lean
          git -C leanVM diff --check
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel check exact representation and audit assumptions
        shell: bash
        run: |
          set -euo pipefail
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build LeanxmssProofs.Bytes
          lake env lean -o .lake/build/lib/lean/DigestBytesBridge.olean DigestBytesBridge.lean
          lake env lean -o .lake/build/lib/lean/BytePackBitVec.olean BytePackBitVec.lean
          lake env lean -o .lake/build/lib/lean/ByteLaneArithmetic.olean ByteLaneArithmetic.lean
          cat > DigestBytesAxioms.lean <<'EOF'
          import DigestBytesBridge
          import BytePackBitVec
          import ByteLaneArithmetic
          #print axioms leanxmss.Proofs.digest_bytes_exact
          #print axioms leanxmss.Proofs.digest_low_half_exact
          #print axioms leanxmss.Proofs.digest_high_half_exact
          #print axioms leanxmss.Proofs.bitvec_eight_lane_reconstruct
          #print axioms leanxmss.Proofs.bitvec_lane_toNat
          #print axioms leanxmss.Proofs.bitvec_byte_ofNat
          EOF
          lake env lean DigestBytesAxioms.lean | tee "$RUNNER_TEMP/axioms.txt"
          python3 - "$RUNNER_TEMP/axioms.txt" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in (
              "leanxmss.Proofs.digest_bytes_exact",
              "leanxmss.Proofs.digest_low_half_exact",
              "leanxmss.Proofs.digest_high_half_exact",
              "leanxmss.Proofs.bitvec_eight_lane_reconstruct",
              "leanxmss.Proofs.bitvec_lane_toNat",
              "leanxmss.Proofs.bitvec_byte_ofNat",
          ):
              matches = re.findall(
                  r"^'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]$",
                  text, re.MULTILINE
              )
              assert len(matches) == 1, (name, matches)
              axioms = {x.strip() for x in matches[0].split(",") if x.strip()}
              assert axioms <= allowed, (name, axioms - allowed)
              print(f"CHECKED {name}: {sorted(axioms)}")
          PY

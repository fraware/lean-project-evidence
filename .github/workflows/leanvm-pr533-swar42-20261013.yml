name: leanVM #533 both-half target-sum SWAR arithmetic

on:
  push:
    branches:
      - research/leanvm-pr533-swar42-targetsum-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swar42:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact upstream #533
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
      - name: Overlay both checked folds and new 42-digit arithmetic lemma
        run: |
          cp research/leanvm-pr533/Encoding-both-folds-swar42.lean leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean
          git -C leanVM diff --check
      - name: Install Lean from pinned toolchain
        run: |
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce full build and audited axiom closure
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          printf 'import LeanxmssProofs\n#print axioms leanxmss.Proofs.Encoding.swar42_nat_spec\n#print axioms leanxmss.Proofs.Encoding.fold6\n#print axioms leanxmss.Proofs.Encoding.fold12\n#print axioms leanxmss.Proofs.encode_spec\n' > AxiomAudit.lean
          lake env lean AxiomAudit.lean | tee "$RUNNER_TEMP/axioms.txt"
          for name in swar42_nat_spec fold6 fold12; do
            grep -F "'leanxmss.Proofs.Encoding.$name' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fv sorryAx
          done
          grep -F "'leanxmss.Proofs.encode_spec' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fq sorryAx

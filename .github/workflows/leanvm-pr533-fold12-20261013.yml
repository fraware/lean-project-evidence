name: leanVM PR 533 isolated fold12 proof attempt

on:
  push:
    branches:
      - research/leanvm-pr533-fold12-attempt-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-fold12:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout experimental proof artifact
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin exact upstream implementation source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
      - name: Verify sole semantic edit and overlay proposed lemma
        run: |
          python3 - <<'PY'
          from pathlib import Path
          upstream=Path("leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean")
          candidate=Path("research/leanvm-pr533/Encoding-fold12-attempt.lean")
          old=upstream.read_text()
          new=candidate.read_text()
          start=old.index("/-- Folding the six 12-bit fields")
          end=old.index("/-- `Digits::get`",start)
          region=old[start:end]
          assert region.count("  sorry\n")==1
          proposed=region.replace("  sorry\n",'''  dsimp
            rw [show (4095 : Nat) = 2 ^ 12 - 1 by decide, Nat.and_two_pow_sub_one_eq_mod]
            simp only [Nat.shiftRight_eq_div_pow]
            norm_num [val] at *
            omega
          '''.replace("            ",""))
          assert new==old[:start]+proposed+old[end:], "Candidate modified an unrelated proof region"
          upstream.write_text(new)
          print("Exact source diff: only fold12 proof body changed.")
          PY
          git -C leanVM diff --check
          git -C leanVM diff --stat
      - name: Install pinned Lean 4 toolchain
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check entire leanXMSS project
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          printf 'import LeanxmssProofs\n#print axioms leanxmss.Proofs.Encoding.fold12\n#print axioms leanxmss.Proofs.verify_spec\n' > ProofCandidateAxioms.lean
          lake env lean ProofCandidateAxioms.lean | tee "$RUNNER_TEMP/fold12-axioms.txt"
          grep -Fq "'leanxmss.Proofs.Encoding.fold12' depends on axioms:" "$RUNNER_TEMP/fold12-axioms.txt"
          if grep -F "'leanxmss.Proofs.Encoding.fold12' depends on axioms:" "$RUNNER_TEMP/fold12-axioms.txt" | grep -Fq 'sorryAx'; then
            echo 'fold12 still depends on sorryAx' >&2
            exit 1
          fi
          grep -F "'leanxmss.Proofs.verify_spec' depends on axioms:" "$RUNNER_TEMP/fold12-axioms.txt" | grep -Fq 'sorryAx'
          echo "VERIFIED: fold12 is sorry-free; higher verifier theorem remains admitted."

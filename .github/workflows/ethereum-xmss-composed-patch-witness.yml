name: Composed XMSS six-file exact patch witness
on:
  push:
    branches:
      - research/ethereum-xmss-composed-handoff-20261012
permissions:
  contents: read
jobs:
  exact-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout pinned PR #1204
        run: |
          git clone --filter=blob:none https://github.com/leanEthereum/leanSpec.git leanSpec
          git -C leanSpec fetch origin pull/1204/head
          git -C leanSpec checkout --detach e8f9c29da3c2b725b988ed85dac8dce3d89d0012
          test "$(git -C leanSpec rev-parse HEAD)" = e8f9c29da3c2b725b988ed85dac8dce3d89d0012
      - name: Validate authenticated publication helper without writing upstream
        run: |
          bash -n handoff_composed/publish_review_comment.sh
          grep -F 'ACTUAL="$(gh api' handoff_composed/publish_review_comment.sh
          grep -F 'gh pr comment "$PR"' handoff_composed/publish_review_comment.sh
          bash -n handoff_composed/publish_stacked_pr.sh
          grep -F 'gh pr create --repo "$BASE_REPO"' handoff_composed/publish_stacked_pr.sh
          grep -F 'git -C "$REPO" apply --check' handoff_composed/publish_stacked_pr.sh
          grep -F '64f51af64ad1704c6e96c88db12a26a1c2140a8c/handoff_composed/PR_BODY_STACKED.md' handoff_composed/publish_stacked_pr.sh
          curl -fsSL https://raw.githubusercontent.com/fraware/lean-project-evidence/64f51af64ad1704c6e96c88db12a26a1c2140a8c/handoff_composed/PR_BODY_STACKED.md -o /tmp/PR_BODY_STACKED.md
          test -s /tmp/PR_BODY_STACKED.md
      - name: Verify Git file identities and reproduce combined candidate
        run: |
          set -euo pipefail
          test "$(git -C leanSpec hash-object src/lean_spec/node/storage/database.py)" = 3023a3aed674fba16e46bda5722a691081c0d20a
          test "$(git -C leanSpec hash-object src/lean_spec/node/storage/sqlite.py)" = 0df19c168bc23751e235f1eef4d56f9b9242933a
          test "$(git -C leanSpec hash-object src/lean_spec/node/validator/signing_protection.py)" = 218c66c035949a1b59f834245273acfa4e46d638
          test "$(git -C leanSpec hash-object tests/node/validator/test_signing_protection.py)" = c31631acd1b9db5bf16dfc5bf15cf03c78eb62d2
          test "$(git -C leanSpec hash-object src/lean_spec/node/validator/service.py)" = 3cbaaa6c66b4a2a7461931a76939d24344e7aa46
          test "$(git -C leanSpec hash-object tests/node/validator/test_service.py)" = 6eb3cd197275d390c4c0dc4e55e0429521604140
          git -C leanSpec apply --check ../handoff_composed/xmss-composed.patch
          git -C leanSpec apply ../handoff_composed/xmss-composed.patch
          git -C leanSpec diff --check
          test "$(git -C leanSpec hash-object src/lean_spec/node/storage/database.py)" = 355dfbb5bd2bd50b1b9d24c67a417b04b4363af0
          test "$(git -C leanSpec hash-object src/lean_spec/node/storage/sqlite.py)" = 660c3dfff3fbc7ad384929831dfd5761812cd773
          test "$(git -C leanSpec hash-object src/lean_spec/node/validator/signing_protection.py)" = 5d7baef324dde273cc8b67ddfba6b6a0c6000236
          test "$(git -C leanSpec hash-object tests/node/validator/test_signing_protection.py)" = 063c055588bdb2818ce73e4af1f0d766dd94d350
          test "$(git -C leanSpec hash-object src/lean_spec/node/validator/service.py)" = 9851994dc3bde0b4fb48c6d68d3a7b075b40960e
          test "$(git -C leanSpec hash-object tests/node/validator/test_service.py)" = 2d83eaa71529bafda6e914e9c8c66b81e98d3870
          python3 -m compileall -q leanSpec/src/lean_spec/node/storage leanSpec/src/lean_spec/node/validator

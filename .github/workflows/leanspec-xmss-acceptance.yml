name: leanSpec XMSS independent acceptance candidate

on:
  push:
    branches:
      - research/leanspec-xmss-acceptance-20261012

permissions:
  contents: read

jobs:
  upstream-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python3 -m pip install 'uv>=0.7,<1'
      - name: Clone exactly pinned leanSpec revision
        run: |
          git clone --filter=blob:none https://github.com/leanEthereum/leanSpec.git leanSpec
          git -C leanSpec checkout --detach 0b7d33ecbc9ee2435759c92de4da4d08d7faf1c8
          test "$(git -C leanSpec rev-parse HEAD)" = 0b7d33ecbc9ee2435759c92de4da4d08d7faf1c8
      - name: Resolve upstream lint and test dependencies
        run: |
          cd leanSpec
          uv sync --frozen --group lint --group test
      - name: Overlay the source-pinned candidate under test
        run: |
          cp candidate/validator_service.py leanSpec/src/lean_spec/node/validator/service.py
          cp candidate/validator_tests.py leanSpec/tests/node/validator/test_service.py
          python3 -m compileall -q leanSpec/src/lean_spec/node/validator/service.py
      - name: Diagnose exact Ruff formatting delta
        run: |
          cd leanSpec
          uv run --no-sync --group lint ruff format --diff tests/node/validator/test_service.py || true
          uv run --no-sync --group lint ruff format tests/node/validator/test_service.py
      - name: Candidate validator lint and format
        run: |
          cd leanSpec
          uv run --no-sync --group lint ruff check --no-fix src/lean_spec/node/validator/service.py tests/node/validator/test_service.py
          uv run --no-sync --group lint ruff format --check src/lean_spec/node/validator/service.py tests/node/validator/test_service.py
      - name: Candidate typecheck
        run: |
          cd leanSpec
          uv run --no-sync --group lint ty check
      - name: Candidate validator tests
        run: |
          cd leanSpec
          uv run --no-sync --group test pytest tests/node/validator/test_service.py -q --no-cov

name: Ethereum XMSS proof lab (isolated)

on:
  push:
    branches:
      - research/ethereum-xmss-proof-lab-20261011
    paths:
      - 'experiments/ethereum-xmss/**'
      - '.github/workflows/ethereum-xmss-proof-lab.yml'
  pull_request:
    paths:
      - 'experiments/ethereum-xmss/**'
      - '.github/workflows/ethereum-xmss-proof-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethereum-xmss-proof-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-proof:
    name: Lean 4.31.0 kernel check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/ethereum-xmss
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean with elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Build pinned proof
        run: lake build
      - name: Reject admitted proof holes
        run: |
          if grep -R -nE '\b(sorry|admit)\b' XmssProofLab.lean; then
            echo 'Unresolved proof or admission in proof lab'
            exit 1
          fi
      - name: Report theorem axioms
        run: |
          printf 'import XmssProofLab\n#print axioms XmssProofLab.sanity_arithmetic\n' > Axioms.lean
          lake env lean Axioms.lean

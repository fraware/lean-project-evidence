name: leanVM PR533 composed Aeneas source-level U64 operation proofs
on:
  push:
    branches:
      - research/leanvm-pr533-aeneas-ops-composed-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin upstream and overlay only source-independent proof modules
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          cp research/leanvm-pr533/Encoding-swar42-all-range-bounds.lean leanVM/verification/leanxmss/LeanxmssProofs/Encoding.lean
          cp research/leanvm-pr533/GuestAddPrefixes.lean leanVM/verification/leanxmss/GuestAddPrefixes.lean
          cp research/leanvm-pr533/GuestShiftMaskWP.lean leanVM/verification/leanxmss/GuestShiftMaskWP.lean
          git -C leanVM diff --check
      - name: Install exact pinned Lean toolchain
        run: |
          grep -Fxq 'leanprover/lean4:v4.31.0' leanVM/verification/leanxmss/lean-toolchain
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check complete parent verification project and both guest modules
        run: |
          cd leanVM/verification/leanxmss
          lake exe cache get
          lake build
          lake env lean -o .lake/build/lib/lean/GuestAddPrefixes.olean GuestAddPrefixes.lean
          lake env lean -o .lake/build/lib/lean/GuestShiftMaskWP.olean GuestShiftMaskWP.lean
          printf 'import GuestAddPrefixes\nimport GuestShiftMaskWP\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_first_add_spec\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_initial_prefixes\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_second_add_spec\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_third_add_spec\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_W_shift_spec\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_even_mask_val\n#print axioms leanxmss.Proofs.Encoding.swar42_guest_low6_mask_val\n#print axioms leanxmss.Proofs.encode_spec\n' > FullAxioms.lean
          lake env lean FullAxioms.lean | tee "$RUNNER_TEMP/axioms.txt"
          for lemma in swar42_guest_first_add_spec swar42_guest_initial_prefixes swar42_guest_second_add_spec swar42_guest_third_add_spec swar42_guest_W_shift_spec swar42_guest_even_mask_val swar42_guest_low6_mask_val; do
            grep -F "'leanxmss.Proofs.Encoding.$lemma' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fv sorryAx
          done
          grep -F "'leanxmss.Proofs.encode_spec' depends on axioms:" "$RUNNER_TEMP/axioms.txt" | grep -Fq sorryAx

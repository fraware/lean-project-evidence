name: leanVM XMSS sum arithmetic 64-bit overflow bound

on:
  push:
    branches:
      - research/leanvm-pr533-sum-no-overflow-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exact leanVM source and two previously checked fold proofs
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanEthereum/leanVM.git leanVM
          git -C leanVM fetch --depth=1 origin pull/533/head
          git -C leanVM checkout --detach 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          test "$(git -C leanVM rev-parse HEAD)" = 4a5a6cf008fc724ad91f9c234d5a3f3d6a7bdc0d
          git -C leanVM apply ../handoff_leanvm_533/both-folds.patch
          test "$(git -C leanVM hash-object verification/leanxmss/LeanxmssProofs/Encoding.lean)" = 41b62c33554ff74b96c129e21cc7fd11d225179c
          cp research/leanvm-pr533/EncodingSumNoOverflow.lean leanVM/verification/leanxmss/EncodingSumNoOverflow.lean
      - name: Install Lean
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the Nat/U64 nonoverflow bound
        run: |
          cd leanVM/verification/leanxmss
          set -o pipefail
          lake exe cache get
          lake build
          lake env lean EncodingSumNoOverflow.lean | tee "$RUNNER_TEMP/bounds-axioms.txt"
          for th in encoding_sum_stages_below_u64 encoding_initial_sum_below_u64; do
            grep -F "'leanxmss.Proofs.Encoding.$th' depends on axioms:" "$RUNNER_TEMP/bounds-axioms.txt"
          done
          if grep -Eq '(sorryAx|_native[.]|Lean[.]trustCompiler)' "$RUNNER_TEMP/bounds-axioms.txt"; then
            echo 'Unexpected admitted or native axiom in overflow proof' >&2
            exit 1
          fi
